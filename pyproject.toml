[project]
name = "wnv-assistant"
version = "0.1.0"
description = "West Nile virus data and knowledge assistant on Databricks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
validate-wnv-data = "wnv_assistant.data_validation:main"

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
    "ruff>=0.12,<1",
    "mlflow>=2.20.0",
    "pandas>=1.5.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
python_files = ["test_*.py", "run_eval.py"]
markers = [
    "real_data: validates collected source files that are intentionally excluded from Git",
    "integration: requires Databricks connectivity (set WNV_DATABRICKS_HOST and WNV_DATABRICKS_TOKEN)",
    "eval: runs the analytics eval suite against a real LLM (requires Databricks connectivity)",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.hatch.build.targets.wheel]
packages = ["src/wnv_assistant"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/pyproject.toml",
    "/uv.lock",
]
