resources:
  jobs:
    ingest_documents:
      name: "[${bundle.target}] WNV Document Ingestion"
      tasks:
        - task_key: ingest
          notebook_task:
            notebook_path: ../notebooks/ingest_documents.py
            # A notebook_task has no environment_vars field the way a
            # serving endpoint does -- confirmed against the bundle schema:
            # `databricks bundle validate` reports environment_vars here as
            # an unknown field. So the notebook receives its connection
            # settings as widget values instead. Only the secret's
            # *location* is passed; the notebook reads the token itself via
            # dbutils.secrets.get, so the token never appears as a job
            # parameter in the run UI. databricks_host and secret_scope are
            # bundle-wide variables, declared in resources/serving.yml.
            base_parameters:
              databricks_host: "${var.databricks_host}"
              secret_scope: "${var.secret_scope}"
              secret_key: "token"
          environment_key: default
      environments:
        - environment_key: default
          spec:
            client: "1"
            dependencies:
              # Pre-installed before the notebook runs. The notebook's own
              # first cell additionally installs the wnv_assistant project
              # package from the workspace checkout -- a path this block
              # cannot state, since it is resolved at runtime from the
              # notebook's own location.
              - pdfplumber==0.11.10
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: "America/Chicago"
        pause_status: PAUSED
      tags:
        project: wnv-assistant
        layer: documents
