resources:
  jobs:
    ingest_documents:
      name: "[${bundle.target}] WNV Document Ingestion"
      tasks:
        - task_key: ingest
          notebook_task:
            notebook_path: ../notebooks/ingest_documents.py
          environment_key: default
      environments:
        - environment_key: default
          spec:
            client: "1"
            dependencies:
              - pdfplumber==0.11.10
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: "America/Chicago"
        pause_status: PAUSED
      tags:
        project: wnv-assistant
        layer: documents
